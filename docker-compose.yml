version: '3.8'

services:
  ddns-agent:
    build: .
    container_name: ddns-agent
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    network_mode: host

